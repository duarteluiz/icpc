server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Canonical URL required for relative navigation and external links.
  location = /icpc {
    return 308 /icpc/;
  }

  # Cloudflare Tunnel forwards the original /icpc/ prefix.
  # Keep the API on the same public origin while rewriting the prefix.
  location ^~ /icpc/api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Remove the mount prefix for files inside /usr/share/nginx/html.
  # Vite-built assets are requested as /icpc/assets/... in the browser.
  location ^~ /icpc/ {
    rewrite ^/icpc/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }

  # Local access http://localhost:18089 and health checks remain valid.
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
